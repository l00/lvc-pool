# Levcoin pool stack.
#   docker compose up -d                  uses an existing node (daemon in config/config.json, LEVCOIN_DAEMON in .env)
#   docker compose --profile node up -d   also runs levcoind in a container
# Only the stratum ports are public. The website and API bind to localhost (WEB_BIND) behind cloudflared;
# the wallet RPC and redis are never published.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  levcoind:
    profiles: ["node"]
    image: levcoin:latest
    logging: *logging
    build: { context: ., dockerfile: docker/levcoin/Dockerfile }
    restart: unless-stopped
    # levcoind ignores hostnames here (ip:port only), and its hardcoded seed nodes are dead
    command: >
      --no-console --rpc-bind-ip=0.0.0.0 --rpc-bind-port=21725
      --add-priority-node=${LEVCOIN_PEER:-131.123.42.246:21724}
    ports:
      - "21724:21724"
    volumes:
      - ./data/chain:/home/levcoin/.levcoin
    stop_grace_period: 2m

  wallet:
    image: levcoin:latest
    logging: *logging
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - >
        exec simplewallet --wallet-file /wallet/pool.wallet
        --password "$$(cat /run/secrets/wallet_password)"
        --daemon-address "${LEVCOIN_DAEMON:-levcoind:21725}"
        --rpc-bind-ip 0.0.0.0 --rpc-bind-port 8070
    volumes:
      - ${WALLET_DIR:-./wallet}:/wallet
    secrets: [wallet_password]
    stop_grace_period: 2m

  redis:
    image: redis:7-alpine
    logging: *logging
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - ./data/redis:/data

  pool:
    image: levcoin-pool:latest
    logging: *logging
    extra_hosts: ["host.docker.internal:host-gateway"]
    build: { context: ., dockerfile: docker/pool/Dockerfile }
    restart: unless-stopped
    depends_on: [redis, wallet]
    ports:
      - "3333:3333"
      - "4444:4444"
      - "5555:5555"
      - "127.0.0.1:8117:8117"
    volumes:
      - ${POOL_CONFIG:-./config/config.json}:/config/config.json:ro
      - ./data/logs:/pool/logs

  web:
    image: nginx:alpine
    logging: *logging
    restart: unless-stopped
    depends_on: [pool]
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:80"
    volumes:
      - ./pool/website_example:/usr/share/nginx/html:ro
      - ./web/config.js:/usr/share/nginx/html/config.js:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # tunnel route in cloudflare: pool.levcoin.org -> http://web:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    logging: *logging
    restart: unless-stopped
    depends_on: [web]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

secrets:
  wallet_password:
    file: ${WALLET_PASSWORD_FILE:-./secrets/wallet_password}
