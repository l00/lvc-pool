server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # admin api stays off the internet; reach it through an ssh tunnel to 127.0.0.1:8117
    location ~ ^/api/admin_ { return 403; }

    location /api/ {
        proxy_pass http://pool:8117/;
        proxy_set_header Host $host;
        # real visitor ip from cloudflare, used by the api for its ip checks
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    }

    location = /config.js { add_header Cache-Control "no-cache"; }
}
